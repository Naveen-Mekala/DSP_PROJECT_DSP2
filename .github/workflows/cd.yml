name: CD - GitHub Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event.created == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then next="v1.0.0"; else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1)); next="v${major}.${minor}.${patch}"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --target "${GITHUB_SHA}" \
            --title "DSP Project ${{ steps.version.outputs.tag }}" \
            --generate-notes
